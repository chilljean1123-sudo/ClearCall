plugins {
    id 'com.android.application'
}

def appUrl = (project.findProperty('clearcallAppUrl')
        ?: System.getenv('CLEARCALL_APP_URL')
        ?: '').toString()
        .replace('\\', '\\\\')
        .replace('"', '\\"')

def rawVersionCode = (System.getenv('CLEARCALL_VERSION_CODE')
        ?: project.findProperty('clearcallVersionCode')
        ?: '1').toString()
def versionCodeValue = rawVersionCode.isInteger() ? rawVersionCode.toInteger() : 1
def versionNameValue = (System.getenv('CLEARCALL_VERSION_NAME')
        ?: project.findProperty('clearcallVersionName')
        ?: '1.0').toString()

def keystorePath = (System.getenv('CLEARCALL_KEYSTORE')
        ?: project.findProperty('clearcallKeystore')
        ?: '').toString()
def keystorePassword = (System.getenv('CLEARCALL_KEYSTORE_PASSWORD')
        ?: project.findProperty('clearcallKeystorePassword')
        ?: '').toString()
def keyAliasValue = (System.getenv('CLEARCALL_KEY_ALIAS')
        ?: project.findProperty('clearcallKeyAlias')
        ?: '').toString()
def keyPasswordValue = (System.getenv('CLEARCALL_KEY_PASSWORD')
        ?: project.findProperty('clearcallKeyPassword')
        ?: '').toString()
def releaseKeystore = keystorePath ? rootProject.file(keystorePath) : null
def hasReleaseSigning = releaseKeystore != null && releaseKeystore.exists()
        && keystorePassword && keyAliasValue && keyPasswordValue

android {
    namespace 'com.clearcall.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.clearcall.app'
        minSdk 26
        targetSdk 35
        versionCode versionCodeValue
        versionName versionNameValue
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
