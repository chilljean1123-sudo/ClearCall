<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的虚拟手机</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 class="page-title">我的虚拟手机</h1>
  <p class="page-subtitle">在浏览器里运行 · 先在「设置」里配置 AI 接口即可使用</p>

  <div class="phone">
    <div class="phone-notch"></div>
    <div class="screen">
      <div class="statusbar">
        <span class="status-time">9:41</span>
        <span class="status-right">
          <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
          <span class="battery"><span class="battery-fill"></span></span>
        </span>
      </div>

      <!-- 主屏幕 -->
      <div class="app-view active" id="view-home">
        <div class="wallpaper">
          <div class="wallpaper-brand">ClearCall</div>
          <div class="wallpaper-slogan">你的虚拟手机</div>
        </div>
        <div class="app-grid">
          <button class="app-icon" data-app="phone">
            <span class="app-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
            <span class="app-name">电话</span>
          </button>
          <button class="app-icon" data-app="sms">
            <span class="app-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
            <span class="app-name">信息</span>
          </button>
          <button class="app-icon" data-app="camera">
            <span class="app-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
            <span class="app-name">相机</span>
          </button>
          <button class="app-icon" data-app="chat">
            <span class="app-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
            <span class="app-name">聊天</span>
          </button>
          <button class="app-icon" data-app="settings">
            <span class="app-glyph accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
            <span class="app-name">设置</span>
          </button>
        </div>
      </div>

      <!-- 设置应用 -->
      <div class="app-view" id="view-settings">
        <header class="app-header">
          <button class="back-btn" id="btn-back" type="button">返回</button>
          <span class="app-title">设置</span>
          <span class="app-header-spacer"></span>
        </header>

        <div class="settings-body">
          <h2 class="settings-title">AI 接口设置</h2>
          <p class="settings-note">配置只保存在你本机浏览器里，不会上传到服务器，也不会写进日志。</p>

          <label class="field">
            <span class="field-label">接口地址（Base URL）</span>
            <input id="input-baseurl" type="text" placeholder="例如 https://api.deepseek.com 或 https://api.openai.com/v1" autocomplete="off" />
            <span class="field-hint">留空会自动补 https://，并追加 /chat/completions</span>
          </label>

          <label class="field">
            <span class="field-label">API Key</span>
            <span class="key-wrap">
              <input id="input-apikey" type="password" placeholder="sk-..." autocomplete="off" />
              <button type="button" class="toggle-key" id="btn-toggle-key">显示</button>
            </span>
          </label>

          <div class="field">
            <span class="field-label">模型名</span>
            <div class="mode-tabs">
              <button type="button" class="mode-tab active" id="tab-select" data-mode="select">选择模型</button>
              <button type="button" class="mode-tab" id="tab-manual" data-mode="manual">手动填写</button>
            </div>

            <div class="model-select-wrap" id="wrap-select">
              <select id="select-model">
                <option value="">请先点「拉取模型」获取列表</option>
              </select>
              <button type="button" class="fetch-btn" id="btn-fetch-models">拉取模型</button>
            </div>

            <div class="model-manual-wrap" id="wrap-manual" hidden>
              <input id="input-model" type="text" placeholder="例如 deepseek-chat / gpt-4o-mini" autocomplete="off" />
            </div>
            <span class="field-hint">可先「拉取模型」从列表选择，或切到「手动填写」直接输入</span>
          </div>

          <button class="test-btn" id="btn-test" type="button">连接测试</button>

          <div class="result" id="result" hidden></div>
        </div>
      </div>

      <!-- 角色聊天 -->
      <div class="app-view" id="view-chat">
        <header class="app-header">
          <button class="back-btn" id="btn-chat-back" type="button">返回</button>
          <span class="app-title" id="chat-title">角色聊天</span>
          <button class="chat-config-btn" id="btn-chat-config" type="button">角色</button>
        </header>

        <div class="chat-messages" id="chat-messages"></div>

        <button type="button" class="generate-btn" id="btn-batch-send" hidden>生成回复</button>

        <div class="chat-inputbar">
          <input id="input-chat" type="text" placeholder="输入消息…" autocomplete="off" />
          <button type="button" class="chat-send-btn" id="btn-chat-send">发送</button>
        </div>
      </div>

      <!-- 角色设置 -->
      <div class="app-view" id="view-char-settings">
        <header class="app-header">
          <button class="back-btn" id="btn-char-settings-back" type="button">返回</button>
          <span class="app-title">角色设置</span>
          <span class="app-header-spacer"></span>
        </header>

        <div class="settings-body">
          <div class="field">
            <span class="field-label">角色名字</span>
            <input id="input-char-name" type="text" placeholder="例如：小助手" autocomplete="off" />
          </div>
          <div class="field">
            <span class="field-label">头像</span>
            <span class="avatar-row">
              <span class="avatar-preview" id="avatar-preview"></span>
              <button type="button" class="fetch-btn" id="btn-upload-avatar">上传头像</button>
              <input type="file" id="file-avatar" accept="image/*" hidden />
              <button type="button" class="fetch-btn" id="btn-clear-avatar">清除</button>
            </span>
          </div>
          <div class="field">
            <span class="field-label">人设</span>
            <textarea id="input-char-persona" rows="5" placeholder="例如：你是一个温柔耐心的助手，用中文回复…"></textarea>
          </div>

          <div class="divider"></div>

          <div class="field">
            <span class="field-label">回复触发模式</span>
            <label class="check-row">
              <input type="checkbox" id="chk-instant" />
              <span>发送即回复（点「发送」立刻上屏并请求 AI）</span>
            </label>
            <label class="check-row">
              <input type="checkbox" id="chk-batch" />
              <span>攒消息手动触发（消息上屏缓存，点「生成回复」一起发）</span>
            </label>
            <label class="check-row">
              <input type="checkbox" id="chk-countdown" />
              <span>空闲倒计时自动回复（无草稿且失焦后倒计时自动发）</span>
            </label>
            <div class="countdown-row">
              <span class="countdown-label">倒计时秒数</span>
              <input type="number" id="input-countdown-sec" min="1" max="60" value="3" />
            </div>
            <span class="field-hint">可多选；同时开启时优先级：即时 &gt; 倒计时 &gt; 批量。全关则等同「即时」。</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
